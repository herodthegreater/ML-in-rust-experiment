[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "autoalgo"
version = "0.1.0"
description = "Speed experiment: k-nearest neighbors three ways (scikit-learn, autoalgo on NumPy, autoalgo in Rust)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.maturin]
python-source = "python"
module-name = "autoalgo._rust"
features = ["pyo3/extension-module"]
