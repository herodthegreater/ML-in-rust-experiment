[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "ml-in-rust-experiment"
version = "0.2.0"
description = "Research: where does compiled Rust beat scikit-learn? Five ML algorithms raced across Python, Rust, BLAS and GPU engines."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.26", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest"]
mlx = ["mlx"]
notebooks = ["jupyter", "matplotlib", "pandas"]

[tool.maturin]
python-source = "python"
module-name = "ml_in_rust._rust"
features = ["pyo3/extension-module"]
